name: CI / Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Viktig: eksplisitte permissions (least privilege).
permissions:
  contents: read
  # packages: read    # slå på hvis du henter fra GitHub Packages
  # id-token: write   # slå på når du faktisk bruker OIDC i denne workflowen

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (dev)
    runs-on: ubuntu-latest
    environment: dev   # fjern denne hvis du ikke har opprettet env "dev" ennå
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Gjør Prisma robust i CI (SQLite). Kjører migrasjoner bare hvis de finnes.
      - name: Prepare Prisma (SQLite)
        run: |
          npx prisma generate
          if [ -d "prisma/migrations" ]; then
            npx prisma migrate deploy || true
          fi

      - name: Build app
        run: npm run build

      # Legg inn tester senere om du vil (npm test)
      # - name: Test
      #   run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            dist/
            build/
            .next/
            coverage/
          if-no-files-found: warn
